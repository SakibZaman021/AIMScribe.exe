<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" color="#1a1a1a" role="img"
     aria-label="AIMScribe system architecture. A partner web application serves a page to the browser on the consulting-room PC; that page reaches the AIMScribe agent only over a loopback WebSocket on the same machine. The agent captures, segments, encrypts, hash-chains and uploads audio to the AIMS LAB backend, which verifies every segment by reading it back. An archive worker inside AIMS LAB dials outward to collect verified sessions. No partner system ever connects to AIMS LAB infrastructure.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.4">
    <!-- zones -->
    <rect x="24" y="96" width="404" height="580" rx="10" stroke-dasharray="6 4" opacity="0.55"/>
    <rect x="516" y="150" width="292" height="330" rx="10" stroke-dasharray="6 4" opacity="0.55"/>
    <rect x="852" y="150" width="244" height="446" rx="10" stroke-dasharray="6 4" opacity="0.55"/>
    <!-- partner strip -->
    <rect x="24" y="24" width="404" height="48" rx="6"/>
    <!-- room contents -->
    <rect x="48" y="128" width="164" height="42" rx="5"/>
    <rect x="240" y="128" width="164" height="42" rx="5"/>
    <rect x="48" y="200" width="356" height="456" rx="8" stroke-width="1.8"/>
    <rect x="68" y="240" width="316" height="40" rx="5"/>
    <rect x="68" y="300" width="316" height="40" rx="5"/>
    <rect x="68" y="360" width="316" height="40" rx="5"/>
    <rect x="68" y="420" width="316" height="40" rx="5"/>
    <rect x="68" y="480" width="316" height="40" rx="5"/>
    <rect x="68" y="600" width="316" height="40" rx="5"/>
    <!-- backend -->
    <rect x="540" y="190" width="244" height="46" rx="5" stroke-width="1.8"/>
    <rect x="540" y="290" width="112" height="60" rx="5"/>
    <rect x="672" y="290" width="112" height="60" rx="5"/>
    <!-- lab -->
    <rect x="876" y="190" width="196" height="46" rx="5" stroke-width="1.8"/>
    <rect x="876" y="300" width="196" height="56" rx="5"/>
    <rect x="876" y="440" width="196" height="66" rx="5" stroke-dasharray="5 4" opacity="0.7"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor">
    <!-- zone titles -->
    <text x="36" y="90" font-size="12.5" font-weight="bold" letter-spacing="0.6">CONSULTING ROOM — one of 14</text>
    <text x="528" y="144" font-size="12.5" font-weight="bold" letter-spacing="0.6">AIMS LAB BACKEND</text>
    <text x="864" y="144" font-size="12.5" font-weight="bold" letter-spacing="0.6">AIMS LAB SERVER</text>

    <text x="226" y="44" font-size="13" font-weight="bold" text-anchor="middle">Partner web application</text>
    <text x="226" y="62" font-size="11.5" text-anchor="middle" opacity="0.8">CMED · Aalo · Amader Susastho — one contract, three partners</text>

    <text x="130" y="147" font-size="12" text-anchor="middle" font-weight="bold">Speakerphone</text>
    <text x="130" y="162" font-size="10.5" text-anchor="middle" opacity="0.8">48 kHz mic array</text>
    <text x="322" y="147" font-size="12" text-anchor="middle" font-weight="bold">Browser</text>
    <text x="322" y="162" font-size="10.5" text-anchor="middle" opacity="0.8">partner page, untrusted</text>

    <text x="226" y="222" font-size="12.5" text-anchor="middle" font-weight="bold">AIMScribe_Agent.exe — enrolled to one clinic</text>
    <text x="226" y="265" font-size="12" text-anchor="middle">Capture · WAV PCM, native rate</text>
    <text x="226" y="325" font-size="12" text-anchor="middle">Segmenter · 30–60 s on a silent gap</text>
    <text x="226" y="385" font-size="12" text-anchor="middle">Spool · AES-256-GCM, 40 GB</text>
    <text x="226" y="445" font-size="12" text-anchor="middle">Hash chain · Ed25519, per session</text>
    <text x="226" y="505" font-size="12" text-anchor="middle">Uploader · store-and-forward</text>
    <text x="226" y="618" font-size="12" text-anchor="middle" font-weight="bold">Recording overlay</text>
    <text x="226" y="633" font-size="10.5" text-anchor="middle" opacity="0.85">Stop · Pause — reason required</text>

    <text x="662" y="211" font-size="12.5" text-anchor="middle" font-weight="bold">API</text>
    <text x="662" y="227" font-size="10.5" text-anchor="middle" opacity="0.85">grants · sessions · verification</text>
    <text x="596" y="316" font-size="12" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="596" y="332" font-size="10.5" text-anchor="middle" opacity="0.85">metadata, audit</text>
    <text x="728" y="316" font-size="12" text-anchor="middle" font-weight="bold">Object store</text>
    <text x="728" y="332" font-size="10.5" text-anchor="middle" opacity="0.85">encrypted segments</text>

    <text x="974" y="211" font-size="12.5" text-anchor="middle" font-weight="bold">Archive worker</text>
    <text x="974" y="227" font-size="10.5" text-anchor="middle" opacity="0.85">outbound only — no inbound port</text>
    <text x="974" y="325" font-size="12" text-anchor="middle" font-weight="bold">Archive volume</text>
    <text x="974" y="341" font-size="10.5" text-anchor="middle" opacity="0.85">raw WAV, never re-encoded</text>
    <text x="974" y="466" font-size="12" text-anchor="middle" font-weight="bold">ASR + NER pipeline</text>
    <text x="974" y="482" font-size="10.5" text-anchor="middle" opacity="0.85">derived rendition only</text>
    <text x="974" y="497" font-size="10.5" text-anchor="middle" opacity="0.85">out of scope for partners</text>
  </g>

  <!-- neutral flows -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)">
    <path d="M226,72 L226,124"/>
    <path d="M130,170 L130,186 L226,186 L226,236"/>
    <path d="M226,280 L226,296"/>
    <path d="M226,340 L226,356"/>
    <path d="M226,400 L226,416"/>
    <path d="M226,460 L226,476"/>
    <path d="M404,500 L470,500 L470,213 L536,213"/>
    <path d="M404,512 L488,512 L488,320 L668,320"/>
    <path d="M662,236 L662,286"/>
    <path d="M700,286 L700,240"/>
    <path d="M876,213 L812,213"/>
    <path d="M974,236 L974,296"/>
    <path d="M974,356 L974,436" stroke-dasharray="5 4"/>
  </g>

  <!-- the partner integration surface: the one path CMED implements -->
  <g fill="none" stroke="#b3261e" stroke-width="2.2" marker-end="url(#ac)">
    <path d="M322,170 L322,196"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" font-size="10.5">
    <text x="234" y="106" opacity="0.85">HTTPS page load</text>
    <text x="138" y="200" opacity="0.85">analogue audio</text>
    <text x="478" y="470" text-anchor="start" opacity="0.85">presigned PUT</text>
    <text x="478" y="188" text-anchor="start" opacity="0.85">HTTPS · device token</text>
    <text x="668" y="270" opacity="0.85">read back</text>
    <text x="704" y="270" opacity="0" >.</text>
    <text x="820" y="205" text-anchor="end" opacity="0.85">outbound poll</text>
    <text x="984" y="400" opacity="0.85">verified WAV</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b3261e" font-weight="bold">
    <text x="336" y="188">trigger · prescription flag</text>
    <text x="336" y="202" font-weight="normal" font-size="10.5">ws://127.0.0.1 — same machine only</text>
  </g>

  <!-- the claim -->
  <g fill="none" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 4">
    <rect x="440" y="612" width="656" height="64" rx="6"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#b3261e">
    <text x="460" y="636" font-size="12" font-weight="bold">No partner system ever connects to AIMS LAB infrastructure.</text>
    <text x="460" y="654" font-size="11" fill="currentColor">The entire integration surface is the red arrow: a WebSocket to 127.0.0.1 on the doctor's own PC.</text>
    <text x="460" y="669" font-size="11" fill="currentColor">Partners hold no key, store no audio, and expose no endpoint to us.</text>
  </g>
</svg>
