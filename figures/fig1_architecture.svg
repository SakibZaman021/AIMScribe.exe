<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" color="#1a1a1a" role="img" aria-label="AIMScribe system architecture. A partner web page on the consulting-room PC sends a trigger and a prescription flag to the AIMScribe agent over a loopback WebSocket on the same machine. The agent captures, segments, encrypts, hash-chains and uploads audio; the backend verifies every segment by reading it back and re-hashing it; an archive worker inside AIMS LAB dials outward to collect verified sessions. No partner system connects to AIMS LAB." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="40" y="66" width="380" height="590" rx="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
<rect x="580" y="66" width="300" height="590" rx="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
<rect x="940" y="66" width="240" height="590" rx="10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.5"/>
<text x="40" y="54" font-size="12" font-weight="600" fill="currentColor">CONSULTING ROOM — one of 14</text>
<text x="580" y="54" font-size="12" font-weight="600" fill="currentColor">AIMS LAB BACKEND</text>
<text x="940" y="54" font-size="12" font-weight="600" fill="currentColor">AIMS LAB SERVER</text>
<rect x="60" y="92" width="138" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="129.0" y="117.095" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Speakerphone</text>
<text x="129.0" y="131.905" font-size="9.5" text-anchor="middle" fill="currentColor">48 kHz mic array</text>
<rect x="214" y="88" width="186" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="307.0" y="110.58" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Partner web page</text>
<text x="307.0" y="124.91999999999999" font-size="9" text-anchor="middle" fill="currentColor">CMED · Aalo · Amader Susastho</text>
<text x="307.0" y="138.54" font-size="9" text-anchor="middle" fill="currentColor">sends trigger + flag</text>
<rect x="60" y="188" width="340" height="448" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="230" y="210" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">AIMScribe_Agent.exe</text>
<text x="230" y="226" font-size="9.5" text-anchor="middle" fill="currentColor">enrolled to exactly one clinic</text>
<rect x="80" y="240" width="300" height="42" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="264.675" font-size="10.5" text-anchor="middle" fill="currentColor">Capture · native rate, no resample</text>
<rect x="80" y="296" width="300" height="42" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="320.675" font-size="10.5" text-anchor="middle" fill="currentColor">Segmenter · 30–60 s on a silent gap</text>
<rect x="80" y="352" width="300" height="42" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="376.675" font-size="10.5" text-anchor="middle" fill="currentColor">Spool · AES-256-GCM, 40 GB</text>
<rect x="80" y="408" width="300" height="42" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="432.675" font-size="10.5" text-anchor="middle" fill="currentColor">Hash chain · Ed25519 per session</text>
<rect x="80" y="464" width="300" height="42" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="488.675" font-size="10.5" text-anchor="middle" fill="currentColor">Uploader · store and forward</text>
<rect x="80" y="552" width="300" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="230.0" y="576.92" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">Recording overlay</text>
<text x="230.0" y="591.6099999999999" font-size="9.5" text-anchor="middle" fill="currentColor">Stop · Pause · all doctor messages</text>
<path d="M230,282 L230,296" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M230,338 L230,352" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
