<path d="M129,148 L129,232" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M307,152 L307,188" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#arA)"/>
<rect x="600" y="140" width="260" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="730.0" y="168.095" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">PostgreSQL</text>
<text x="730.0" y="182.905" font-size="9.5" text-anchor="middle" fill="currentColor">sessions · devices · audit log</text>
<rect x="600" y="300" width="260" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="730.0" y="328.09499999999997" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">API</text>
<text x="730.0" y="342.905" font-size="9.5" text-anchor="middle" fill="currentColor">grants · sessions · verification</text>
<rect x="600" y="460" width="260" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="730.0" y="488.09499999999997" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Object store</text>
<text x="730.0" y="502.905" font-size="9.5" text-anchor="middle" fill="currentColor">encrypted segments</text>
<path d="M420,331 L594,331" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M420,491 L594,491" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M726,300 L726,208" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M700,362 L700,454" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="500" y="322" font-size="10" text-anchor="middle" fill="currentColor">HTTPS · device token</text>
<text x="500" y="482" font-size="10" text-anchor="middle" fill="currentColor">presigned PUT</text>
<text x="736" y="258" font-size="9.5" fill="currentColor">reads · writes</text>
<text x="710" y="400" font-size="9.5" fill="currentColor">reads back</text>
<text x="710" y="414" font-size="9.5" fill="currentColor">and re-hashes</text>
<rect x="960" y="300" width="200" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1060.0" y="328.09499999999997" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Archive worker</text>
<text x="1060.0" y="342.905" font-size="9.5" text-anchor="middle" fill="currentColor">no inbound port</text>
<rect x="960" y="460" width="200" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1060.0" y="488.09499999999997" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Archive volume</text>
<text x="1060.0" y="502.905" font-size="9.5" text-anchor="middle" fill="currentColor">raw WAV, never re-encoded</text>
<rect x="960" y="570" width="200" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1060.0" y="592.745" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">ASR + NER</text>
<text x="1060.0" y="607.3149999999999" font-size="9.5" text-anchor="middle" fill="currentColor">out of scope</text>
<path d="M954,331 L866,331" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M1060,362 L1060,454" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M1060,522 L1060,564" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="910" y="322" font-size="10" text-anchor="middle" fill="currentColor">polls</text>
<text x="1070" y="412" font-size="9.5" fill="currentColor">verified WAV</text>
<text x="40" y="682" font-size="11.5" font-weight="600" fill="#b3261e">The red arrow is the entire partner integration: a WebSocket to 127.0.0.1 on the doctor’s own PC.</text>
<text x="40" y="697" font-size="11" fill="currentColor">No partner system connects to AIMS LAB. Partners hold no key, store no audio, and expose no endpoint to us.</text>
</svg>
