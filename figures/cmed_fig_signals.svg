<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" color="#1a1a1a" role="img" aria-label="The three signals CMED sends across one consultation. The trigger starts the recording. Patient information follows once it is running. The prescription-built signal arms the recording but does not stop it, so counselling after the printout is still captured. The next patient's trigger stops the previous recording and starts the new one at the same instant." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="24" y="26" font-size="12.5" font-weight="600" fill="currentColor">One consultation, three signals from CMED</text>
<text x="24" y="44" font-size="9.5" fill="currentColor">The microphone is open continuously from the first trigger to the next patient's trigger.</text>
<rect x="120" y="68" width="520" height="68" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="380.0" y="92.23" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">API 1 · Trigger</text>
<text x="380.0" y="106.33" font-size="9" text-anchor="middle" fill="#b3261e">patient_id · doctor_id · hospital_id · start_time · date</text>
<text x="380.0" y="119.94999999999999" font-size="9" text-anchor="middle" fill="#b3261e">Recording starts immediately</text>
<rect x="120" y="152" width="520" height="68" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="380.0" y="176.23" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">API 2 · Patient information</text>
<text x="380.0" y="190.32999999999998" font-size="9" text-anchor="middle" fill="#b3261e">paramedic tests, notes, demographics — and the previous</text>
<text x="380.0" y="203.95" font-size="9" text-anchor="middle" fill="#b3261e">prescription if this patient has been here before</text>
<rect x="120" y="236" width="520" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="380.0" y="261.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Consultation</text>
<text x="380.0" y="275.13999999999993" font-size="9" text-anchor="middle" fill="currentColor">no signal — the recording simply runs</text>
<rect x="120" y="320" width="520" height="56" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="380.0" y="345.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">API 3 · Prescription built</text>
<text x="380.0" y="359.13999999999993" font-size="9" text-anchor="middle" fill="#b3261e">ARMS the recording. It does NOT stop it.</text>
<rect x="120" y="404" width="520" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="380.0" y="429.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Counselling after the printout</text>
<text x="380.0" y="443.13999999999993" font-size="9" text-anchor="middle" fill="currentColor">1–2 minutes — still recording, and this is the point</text>
<rect x="120" y="488" width="520" height="68" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="380.0" y="512.23" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">API 1 · Next patient</text>
<text x="380.0" y="526.33" font-size="9" text-anchor="middle" fill="#b3261e">previous recording stops, new one starts at the same</text>
<text x="380.0" y="539.95" font-size="9" text-anchor="middle" fill="#b3261e">instant — no gap between the two</text>
<path d="M380,124 L380,140" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M380,208 L380,224" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M380,292 L380,308" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M380,376 L380,392" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M380,460 L380,476" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M96,68 L84,68 L84,544 L96,544" fill="none" stroke="#b3261e" stroke-width="2.2"/>
<text x="24" y="300" font-size="9" font-weight="600" fill="#b3261e">RECORDING</text>
<text x="24" y="313" font-size="9" fill="#b3261e">open</text>
<text x="24" y="326" font-size="9" fill="#b3261e">throughout</text>
<text x="24" y="578" font-size="10" font-weight="600" fill="#b3261e">Printing the prescription is not the end of the consultation.</text>
<text x="24" y="594" font-size="10" fill="currentColor">That is why API 3 arms the recording instead of stopping it.</text>
</svg>
