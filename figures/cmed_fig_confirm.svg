<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" color="#1a1a1a" role="img" aria-label="Trigger confirmation. When the doctor opens a patient, the CMED page sends the trigger to the recorder on the same PC and CMED's server sends patient information to the AIMS LAB server, both carrying the same five fields. The recorder asks the AIMS LAB server for permission; the server confirms the recording only if a matching notice from CMED's server exists." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="24" y="26" font-size="12.5" font-weight="600" fill="currentColor">Two messages, two routes, one match</text>
<text x="24" y="44" font-size="9.5" fill="currentColor">A recording is confirmed only when both copies of the same five fields meet at our server.</text>
<rect x="230" y="64" width="220" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="340.0" y="89.67500000000001" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Doctor opens patient details</text>
<rect x="24" y="160" width="250" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="149.0" y="187.16" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">CMED page</text>
<text x="149.0" y="200.67000000000002" font-size="8.5" text-anchor="middle" fill="currentColor">same PC as the recorder</text>
<rect x="24" y="290" width="250" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="149.0" y="317.16" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">aimscribe.exe</text>
<text x="149.0" y="330.67" font-size="8.5" text-anchor="middle" fill="currentColor">microphone opens at once</text>
<path d="M290,108 L150,108 L150,154" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<path d="M150,220 L150,284" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="160" y="246" font-size="9" font-weight="600" fill="#b3261e">1 · trigger</text>
<text x="160" y="259" font-size="9" fill="#b3261e">5 fields</text>
<rect x="406" y="160" width="250" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="531.0" y="187.16" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">CMED server</text>
<text x="531.0" y="200.67000000000002" font-size="8.5" text-anchor="middle" fill="currentColor">knows the doctor opened it</text>
<path d="M390,108 L531,108 L531,154" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<rect x="236" y="410" width="420" height="76" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="446.0" y="438.82" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">AIMS LAB server</text>
<text x="446.0" y="452.45" font-size="8.5" text-anchor="middle" fill="currentColor">holds the notice for a few minutes</text>
<text x="446.0" y="465.48" font-size="8.5" text-anchor="middle" fill="currentColor">matches: hospital · doctor · patient · start time</text>
<path d="M531,220 L531,404" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="541" y="300" font-size="9" font-weight="600" fill="#b3261e">2 · patient information</text>
<text x="541" y="313" font-size="9" fill="#b3261e">same 5 fields</text>
<text x="541" y="326" font-size="9" fill="#b3261e">+ demographics</text>
<path d="M150,350 L150,448 L230,448" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="380" font-size="9" font-weight="600" fill="currentColor">3 · may I record?</text>
<text x="160" y="393" font-size="9" fill="currentColor">same 5 fields</text>
<text x="24" y="516" font-size="10" font-weight="600" fill="currentColor">Match found — recording confirmed, and linked to its patient information.</text>
<text x="24" y="534" font-size="10" fill="currentColor">No match — recording continues, marked unconfirmed, kept out of the dataset.</text>
</svg>
