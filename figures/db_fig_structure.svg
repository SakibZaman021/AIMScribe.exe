<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 750" color="#1a1a1a" role="img" aria-label="The two databases. aims_recordings tracks every recording and its integrity; aims_clinical holds patient information and prescriptions. They share only patient_id and the recording file name. On the archive array, each recording's WAV and JSON files sit in the same folder under the same name." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="24" y="26" font-size="12.5" font-weight="600" fill="currentColor">Two databases, one shared file name</text>
<text x="24" y="42" font-size="9.5" fill="currentColor">They share only patient_id and the recording file name.</text>
