<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" color="#1a1a1a" role="img" aria-label="Grant minting moves to the AIMS LAB backend. The partner page sends five plain unsigned fields; the backend validates them against its own register and returns a short-lived single-use grant. The partner holds no key." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="40" y="32" font-size="11" font-weight="600" fill="currentColor">The change that matters most to a partner: you hold no key, sign nothing, and expose no endpoint.</text>
<rect x="40" y="54" width="220" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="150.0" y="76.2" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Partner page</text>
<line x1="150" y1="90" x2="150" y2="366" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="360" y="54" width="220" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="470.0" y="76.2" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">AIMScribe agent</text>
<line x1="470" y1="90" x2="470" y2="366" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="690" y="54" width="220" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="800.0" y="76.2" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">AIMS LAB backend</text>
<line x1="800" y1="90" x2="800" y2="366" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<path d="M156,126 L464,126" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="310.0" y="119" font-size="10" font-weight="600" text-anchor="middle" fill="#b3261e">trigger — 5 plain fields, unsigned</text>
<path d="M476,170 L794,170" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="635.0" y="163" font-size="10" text-anchor="middle" fill="currentColor">POST /grant/mint  (device token)</text>
<rect x="680" y="190" width="240" height="84" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="800.0" y="208.435" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">validate against OUR register</text>
<text x="800.0" y="222.41500000000002" font-size="9" text-anchor="middle" fill="currentColor">doctor exists and is active</text>
<text x="800.0" y="236.03500000000003" font-size="9" text-anchor="middle" fill="currentColor">doctor practises at that clinic</text>
<text x="800.0" y="249.65500000000003" font-size="9" text-anchor="middle" fill="currentColor">clinic matches THIS device</text>
<text x="800.0" y="263.27500000000003" font-size="9" text-anchor="middle" fill="currentColor">consent flag present</text>
<path d="M794,300 L476,300" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="635.0" y="293" font-size="10" text-anchor="middle" fill="currentColor">signed grant · 60 s · single use</text>
<rect x="360" y="320" width="220" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="470.0" y="336.22" font-size="9.5" text-anchor="middle" fill="currentColor">verify against the pinned</text>
<text x="470.0" y="350.43" font-size="9.5" text-anchor="middle" fill="currentColor">backend public key, then record</text>
<text x="40" y="396" font-size="10.5" fill="currentColor">Before, the agent trusted what a page claimed. Now the backend checks every claim against a register the page cannot reach.</text>
</svg>
