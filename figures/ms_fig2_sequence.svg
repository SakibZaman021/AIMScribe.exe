<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 900" color="#1a1a1a" role="img" aria-label="Sequence diagram of the acquisition pathway. Opening a patient sends a trigger to the local daemon and, at the same moment, a corroborating notice from the EHR server to the backend. Acquisition begins immediately; the backend authorises the recording only if the daemon's request matches the notice exactly. Segments are sealed, uploaded and verified throughout, and local material is deleted on the purge receipt." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="15" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">EHR node</text>
<line x1="110" y1="76" x2="110" y2="800" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="235" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">aimscribe.exe</text>
<line x1="330" y1="76" x2="330" y2="800" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="455" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="550.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">AIMS Lab backend</text>
<line x1="550" y1="76" x2="550" y2="800" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<text x="20" y="26" font-size="9.5" font-style="italic" fill="currentColor">Clinician selects patient details in the record system</text>
<path d="M110,30 L110,40" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M115,106 L325,106" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="220.0" y="100" font-size="9" font-weight="600" text-anchor="middle" fill="#b3261e">1a · trigger (loopback)</text>
<path d="M115,140 L545,140" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="122" y="134" font-size="9" font-weight="600" fill="#b3261e">1b · notice: same five fields</text>
<rect x="214" y="160" width="436" height="196" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="224" y="175" font-size="8.5" font-style="italic" fill="currentColor">par — capture is not deferred to authorisation</text>
<rect x="230" y="186" width="200" height="26" rx="5" fill="none" stroke="#b3261e" stroke-width="1.6"/>
<text x="330.0" y="202.32500000000002" font-size="9.5" font-weight="600" text-anchor="middle" fill="#b3261e">2 · acquisition begins (t = 0)</text>
<path d="M335,246 L545,246" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="240" font-size="9" text-anchor="middle" fill="currentColor">3 · request authorisation</text>
<rect x="450" y="262" width="200" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="276.81" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">4 · match notice exactly;</text>
<text x="550.0" y="290.08" font-size="8.5" text-anchor="middle" fill="currentColor">check device and clinic</text>
<path d="M545,334 L335,334" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="328" font-size="9" text-anchor="middle" fill="currentColor">5 · signed authorisation, 60 s</text>
<path d="M335,384 L545,384" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="378" font-size="9" text-anchor="middle" fill="currentColor">6 · open session + chain entry 0</text>
<rect x="214" y="410" width="436" height="170" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="224" y="425" font-size="8.5" font-style="italic" fill="currentColor">loop — every 30 to 60 s until the encounter ends</text>
<rect x="230" y="436" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="330.0" y="452.325" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">7 · seal segment (AES-256-GCM)</text>
<path d="M335,496 L545,496" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="490" font-size="9" text-anchor="middle" fill="currentColor">8 · upload over TLS + digest</text>
<rect x="450" y="512" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="528.3249999999999" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">9 · re-read and re-hash to verify</text>
<path d="M115,614 L325,614" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="220.0" y="608" font-size="9" font-weight="600" text-anchor="middle" fill="#b3261e">10 · encounter concluded</text>
<path d="M335,652 L545,652" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="646" font-size="9" text-anchor="middle" fill="currentColor">11 · close session + chain tail</text>
<rect x="450" y="668" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="684.3249999999999" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">12 · verify the whole chain</text>
<path d="M545,726 L335,726" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="440.0" y="720" font-size="9" text-anchor="middle" fill="#b3261e">13 · purge receipt</text>
<rect x="230" y="742" width="200" height="36" rx="5" fill="none" stroke="#b3261e" stroke-width="1.6"/>
<text x="330.0" y="756.81" font-size="9.5" font-weight="600" text-anchor="middle" fill="#b3261e">14 · delete local copy</text>
<text x="330.0" y="770.0799999999999" font-size="8.5" text-anchor="middle" fill="currentColor">immediately on receipt</text>
<text x="20" y="832" font-size="9" fill="currentColor">1a and 1b are sent together. Authorisation needs the request to match 1b; acquisition waits for neither.</text>
<text x="20" y="848" font-size="9" fill="currentColor">A request with no matching notice keeps recording, and is withheld from the dataset as unconfirmed.</text>
<text x="20" y="878" font-size="9.5" font-weight="600" fill="#b3261e">Local material is deleted only on the purge receipt (step 13).</text>
</svg>
