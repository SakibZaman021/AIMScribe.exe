<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 900" color="#1a1a1a" role="img" aria-label="Sequence diagram of the acquisition pathway. Selection of patient details dispatches a trigger to the local daemon. Acquisition begins immediately while authorisation is validated by the backend in parallel. Segments are sealed, uploaded and verified by server-side re-hashing throughout. Local material is released for deletion only against a purge receipt." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="15" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">EHR page</text>
<line x1="110" y1="76" x2="110" y2="866" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="235" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">aimscribe.exe</text>
<line x1="330" y1="76" x2="330" y2="866" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="455" y="44" width="190" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="550.0" y="63.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">AIMS Lab backend</text>
<line x1="550" y1="76" x2="550" y2="866" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<text x="20" y="26" font-size="9.5" font-style="italic" fill="currentColor">Clinician selects patient details in the record system</text>
<path d="M110,30 L110,40" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M115,106 L325,106" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="220.0" y="100" font-size="9" font-weight="600" text-anchor="middle" fill="#b3261e">1 · trigger: patient, doctor, clinic</text>
<rect x="214" y="126" width="436" height="190" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="224" y="141" font-size="8.5" font-style="italic" fill="currentColor">par — capture is not deferred to authorisation</text>
<rect x="230" y="152" width="200" height="26" rx="5" fill="none" stroke="#b3261e" stroke-width="1.6"/>
<text x="330.0" y="168.32500000000002" font-size="9.5" font-weight="600" text-anchor="middle" fill="#b3261e">2 · acquisition begins (t = 0)</text>
<path d="M335,212 L545,212" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="206" font-size="9" text-anchor="middle" fill="currentColor">3 · request authorisation</text>
<rect x="450" y="228" width="200" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="242.81" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">4 · validate device, clinic,</text>
<text x="550.0" y="256.08" font-size="8.5" text-anchor="middle" fill="currentColor">clinician and consent</text>
<path d="M545,300 L335,300" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="294" font-size="9" text-anchor="middle" fill="currentColor">5 · signed authorisation, 60 s</text>
<path d="M335,348 L545,348" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="342" font-size="9" text-anchor="middle" fill="currentColor">6 · open session + chain entry 0</text>
<rect x="214" y="376" width="436" height="174" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.7"/>
<text x="224" y="391" font-size="8.5" font-style="italic" fill="currentColor">loop — every 30 to 60 s until the encounter ends</text>
<rect x="230" y="402" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="330.0" y="418.325" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">7 · seal segment (AES-256-GCM)</text>
<path d="M335,462 L545,462" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="456" font-size="9" text-anchor="middle" fill="currentColor">8 · upload over TLS + digest</text>
<rect x="450" y="478" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="494.325" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">9 · re-read and re-hash to verify</text>
<path d="M115,586 L325,586" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="220.0" y="580" font-size="9" font-weight="600" text-anchor="middle" fill="#b3261e">10 · encounter concluded</text>
<path d="M335,626 L545,626" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="440.0" y="620" font-size="9" text-anchor="middle" fill="currentColor">11 · close session + chain tail</text>
<rect x="450" y="642" width="200" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
<text x="550.0" y="658.3249999999999" font-size="9.5" font-weight="600" text-anchor="middle" fill="currentColor">12 · verify the whole chain</text>
<path d="M545,702 L335,702" fill="none" stroke="#b3261e" stroke-width="1.9" marker-end="url(#arA)"/>
<text x="440.0" y="696" font-size="9" text-anchor="middle" fill="#b3261e">13 · purge receipt</text>
<rect x="230" y="718" width="200" height="36" rx="5" fill="none" stroke="#b3261e" stroke-width="1.6"/>
<text x="330.0" y="732.81" font-size="9.5" font-weight="600" text-anchor="middle" fill="#b3261e">14 · delete local copy</text>
<text x="330.0" y="746.0799999999999" font-size="8.5" text-anchor="middle" fill="currentColor">after a 24 h grace window</text>
<text x="20" y="806" font-size="9" fill="currentColor">Acquisition, authorisation and transmission proceed concurrently;</text>
<text x="20" y="820" font-size="9" fill="currentColor">no step in the pathway blocks the consultation in progress.</text>
<text x="20" y="848" font-size="9.5" font-weight="600" fill="#b3261e">Local material is released for deletion only at step 13.</text>
</svg>
