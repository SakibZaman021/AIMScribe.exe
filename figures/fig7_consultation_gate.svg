<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" color="#1a1a1a" role="img" aria-label="The consultation gate. A session begins un-armed; a stray trigger is refused and the recording continues. Only the prescription-built flag arms the gate, after which the next trigger hands over with no gap in capture." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="40" y="32" font-size="11" font-weight="600" fill="currentColor">A new patient cannot end the current recording until that consultation's prescription has been built.</text>
<rect x="70" y="120" width="200" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="170.0" y="149.27" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">RECORDING</text>
<text x="170.0" y="164.20000000000002" font-size="9.5" text-anchor="middle" fill="currentColor">gate not armed</text>
<rect x="400" y="120" width="200" height="64" rx="10" fill="none" stroke="#b3261e" stroke-width="2"/>
<text x="500.0" y="149.27" font-size="12.5" font-weight="600" text-anchor="middle" fill="#b3261e">ARMED</text>
<text x="500.0" y="164.20000000000002" font-size="9.5" text-anchor="middle" fill="#b3261e">handover permitted</text>
<rect x="730" y="120" width="200" height="64" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="830.0" y="149.27" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">CLOSED</text>
<text x="830.0" y="164.20000000000002" font-size="9.5" text-anchor="middle" fill="currentColor">reason recorded</text>
<path d="M276,152 L394,152" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="335" y="144" font-size="9.5" text-anchor="middle" fill="#b3261e">consultation_complete</text>
<path d="M606,152 L724,152" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="665" y="144" font-size="9.5" text-anchor="middle" fill="currentColor">doctor presses Stop</text>
<path d="M120,120 L120,86 L220,86 L220,120" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="230" y="90" font-size="9.5" fill="currentColor">stray trigger — refused, 409 GATE_NOT_ARMED, recording continues</text>
<path d="M500,184 L500,232 L170,232 L170,184" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="510" y="228" font-size="9.5" fill="#b3261e">next trigger — close this session, open the next on a parallel thread, no gap</text>
<text x="40" y="300" font-size="10.5" fill="currentColor">Residual risk: a patient who leaves before a prescription is built never arms the gate, and the session stays open until the doctor stops it.</text>
<text x="40" y="316" font-size="10.5" fill="currentColor">That is why the overlay's Stop button is always visible.</text>
</svg>
