<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1090" color="#1a1a1a" role="img" aria-label="Life of a consultation. The partner page sends a trigger; the microphone opens immediately while authorisation proceeds in parallel. Segments are sealed, uploaded and verified by server-side read-back every thirty to sixty seconds. A prescription-built flag arms the gate; until it arrives a stray trigger is refused and the recording continues. Once armed the next trigger closes one session and opens the next with no gap. Local audio is deleted only after the chain verifies and purge receipts are issued." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="35" y="24" width="210" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="140.0" y="48.375" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Partner page</text>
<line x1="140" y1="64" x2="140" y2="1066" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="325" y="24" width="210" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="430.0" y="48.375" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">AIMScribe agent</text>
<line x1="430" y1="64" x2="430" y2="1066" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="635" y="24" width="210" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="740.0" y="48.375" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">AIMS LAB backend</text>
<line x1="740" y1="64" x2="740" y2="1066" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<rect x="905" y="24" width="210" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1010.0" y="48.375" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Archive</text>
<line x1="1010" y1="64" x2="1010" y2="1066" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
<path d="M146,104 L424,104" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="285.0" y="97" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">1 · trigger — 5 fields</text>
<rect x="300" y="120" width="560" height="180" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
<text x="312" y="135" font-size="9.5" font-style="italic" fill="currentColor">capture and authorisation run in parallel — a slow link never costs the opening seconds</text>
<rect x="308" y="148" width="244" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="430.0" y="166.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">2 · microphone opens — t = 0</text>
<path d="M436,196 L734,196" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="189" font-size="10.5" text-anchor="middle" fill="currentColor">3 · mint grant (device token)</text>
<rect x="618" y="212" width="244" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="740.0" y="230.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">4 · check doctor · clinic · device</text>
<path d="M734,272 L436,272" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="265" font-size="10.5" text-anchor="middle" fill="currentColor">5 · signed grant · 60 s · single use</text>
<path d="M436,324 L734,324" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="317" font-size="10.5" text-anchor="middle" fill="currentColor">6 · session/open + chain entry 0</text>
<path d="M734,360 L436,360" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="353" font-size="10.5" text-anchor="middle" fill="currentColor">7 · session_id (ULID)</text>
<path d="M424,396 L146,396" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="285.0" y="389" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">8 · 200 RECORDING_STARTED</text>
<rect x="300" y="420" width="560" height="180" rx="6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
<text x="312" y="435" font-size="9.5" font-style="italic" fill="currentColor">repeats every 30–60 s until the consultation ends</text>
<path d="M436,456 L734,456" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="449" font-size="10.5" text-anchor="middle" fill="currentColor">9 · segment/authorize</text>
<path d="M436,492 L734,492" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="485" font-size="10.5" text-anchor="middle" fill="currentColor">10 · PUT encrypted segment</text>
<path d="M436,528 L734,528" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="521" font-size="10.5" text-anchor="middle" fill="currentColor">11 · commit + declared SHA-256</text>
<rect x="618" y="552" width="244" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="740.0" y="570.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">12 · read back · re-hash · compare</text>
<path d="M146,636 L424,636" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="285.0" y="629" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b3261e">13 · consultation_complete</text>
<rect x="308" y="652" width="244" height="30" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="430.0" y="670.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b3261e">14 · GATE ARMED</text>
<path d="M146,716 L424,716" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="285.0" y="709" font-size="10.5" text-anchor="middle" fill="#b3261e">15a · trigger while gate NOT armed</text>
<path d="M424,748 L146,748" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arA)"/>
<text x="285.0" y="741" font-size="10.5" text-anchor="middle" fill="#b3261e">409 GATE_NOT_ARMED — recording continues</text>
<path d="M146,792 L424,792" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="285.0" y="785" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b3261e">15b · trigger, gate armed</text>
<rect x="308" y="808" width="244" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="430.0" y="824.57" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">16 · close N, open N+1</text>
<text x="430.0" y="839.02" font-size="9.5" text-anchor="middle" fill="currentColor">parallel threads — no gap in capture</text>
<path d="M436,878 L734,878" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="871" font-size="10.5" text-anchor="middle" fill="currentColor">17 · session/close + chain tail</text>
<rect x="618" y="894" width="244" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="740.0" y="912.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">18 · verify the whole chain</text>
<path d="M734,954 L436,954" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585.0" y="947" font-size="10.5" text-anchor="middle" fill="currentColor">19 · purge receipts</text>
<rect x="308" y="970" width="244" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="430.0" y="986.57" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">20 · delete local audio</text>
<text x="430.0" y="1001.02" font-size="9.5" text-anchor="middle" fill="currentColor">only now, after a 24 h grace window</text>
<path d="M746,1040 L1004,1040" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="875.0" y="1033" font-size="10.5" text-anchor="middle" fill="currentColor">21 · verified session</text>
<rect x="888" y="1056" width="244" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1010.0" y="1075.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">22 · concatenate · verify · file</text>
</svg>
