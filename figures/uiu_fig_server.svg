<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" color="#1a1a1a" role="img" aria-label="AIMScribe on the UIU server. Recorders upload audio pieces to Cloudflare R2 and send their requests to the UIU server. The UIU server reads each piece back to check it, merges the pieces into one WAV per consultation on its archive array, and uploads a lossless, encrypted FLAC copy back to R2, after which the raw pieces are deleted. CMED sends clinical data to the UIU server." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="24" y="26" font-size="12.5" font-weight="600" fill="currentColor">AIMScribe on the UIU server</text>
<text x="24" y="42" font-size="9.5" fill="currentColor">Pieces go to the cloud first. The merged, compressed copy stays there.</text>
<rect x="24" y="64" width="180" height="76" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="114.0" y="92.23" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Consulting rooms</text>
<text x="114.0" y="106.33" font-size="9" text-anchor="middle" fill="currentColor">14 rooms · 7 sites</text>
<text x="114.0" y="119.94999999999999" font-size="9" text-anchor="middle" fill="currentColor">aimscribe.exe</text>
<rect x="250" y="64" width="180" height="76" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="340.0" y="92.23" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">Cloudflare R2</text>
<text x="340.0" y="106.33" font-size="9" text-anchor="middle" fill="#b3261e">raw pieces until merged</text>
<text x="340.0" y="119.94999999999999" font-size="9" text-anchor="middle" fill="#b3261e">merged FLAC copy, kept</text>
<rect x="476" y="64" width="180" height="76" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="566.0" y="92.23" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">CMED server</text>
<text x="566.0" y="106.33" font-size="9" text-anchor="middle" fill="currentColor">patient information</text>
<text x="566.0" y="119.94999999999999" font-size="9" text-anchor="middle" fill="currentColor">prescriptions</text>
<path d="M204,90 L244,90" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="224" y="84" font-size="9" text-anchor="middle" fill="currentColor">pieces</text>
<path d="M114,140 L114,206" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="124" y="176" font-size="9" fill="currentColor">requests</text>
<path d="M310,140 L310,206" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="302" y="176" font-size="9" text-anchor="end" fill="currentColor">read back · merge</text>
<path d="M370,206 L370,146" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="380" y="176" font-size="9" fill="#b3261e">FLAC copy</text>
<path d="M566,140 L566,206" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<text x="576" y="176" font-size="9" fill="#b3261e">clinical data</text>
<rect x="24" y="196" width="632" height="364" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="24" y="190" font-size="10" font-weight="600" fill="currentColor">UIU SERVER</text>
<rect x="44" y="212" width="592" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="340.0" y="237.675" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">HTTPS gateway · TLS · only port 443 open</text>
<rect x="44" y="276" width="184" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="136.0" y="301.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">API</text>
<text x="136.0" y="315.13999999999993" font-size="9" text-anchor="middle" fill="currentColor">authorise · verify · store</text>
<rect x="248" y="276" width="184" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="340.0" y="301.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Dashboard</text>
<text x="340.0" y="315.13999999999993" font-size="9" text-anchor="middle" fill="currentColor">daily volume · integrity</text>
<rect x="452" y="276" width="184" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="544.0" y="300.865" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Background workers</text>
<text x="544.0" y="314.84499999999997" font-size="9" text-anchor="middle" fill="currentColor">merge · compress · verify</text>
<rect x="44" y="352" width="284" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="186.0" y="377.03999999999996" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">PostgreSQL</text>
<text x="186.0" y="391.13999999999993" font-size="9" text-anchor="middle" fill="currentColor">aims_recordings · aims_clinical</text>
<rect x="348" y="352" width="176" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="436.0" y="376.865" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Monitoring and alerts</text>
<text x="436.0" y="390.84499999999997" font-size="9" text-anchor="middle" fill="currentColor">recorders · disks · jobs</text>
<text x="44" y="446" font-size="9" font-weight="600" fill="currentColor">DISKS — kept separate so archive writes never slow the database</text>
<rect x="44" y="456" width="184" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="136.0" y="478.055" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Database disks</text>
<text x="136.0" y="492.03499999999997" font-size="9" text-anchor="middle" fill="currentColor">NVMe mirror</text>
<text x="136.0" y="505.655" font-size="9" text-anchor="middle" fill="currentColor">power-loss protected</text>
<rect x="248" y="456" width="184" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="340.0" y="478.055" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Working disks</text>
<text x="340.0" y="492.03499999999997" font-size="9" text-anchor="middle" fill="currentColor">NVMe</text>
<text x="340.0" y="505.655" font-size="9" text-anchor="middle" fill="currentColor">merge and compress</text>
<rect x="452" y="456" width="184" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="544.0" y="478.055" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Archive array</text>
<text x="544.0" y="492.03499999999997" font-size="9" text-anchor="middle" fill="currentColor">RAID 6</text>
<text x="544.0" y="505.655" font-size="9" text-anchor="middle" fill="currentColor">WAV + JSON, same name</text>
<path d="M136,256 L136,270" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M544,256 L544,270" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M136,332 L136,346" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M136,408 L136,432" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M590,332 L590,432" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="24" y="596" font-size="10" font-weight="600" fill="currentColor">Nothing stays on clinic PCs, and no raw pieces stay in the cloud.</text>
<text x="24" y="614" font-size="9.5" fill="currentColor">Each finished consultation: WAV + JSON on the archive array, and one lossless FLAC copy in R2.</text>
<text x="24" y="632" font-size="9.5" fill="currentColor">Database dumps are also encrypted and sent to R2 every night.</text>
</svg>
