<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" color="#1a1a1a" role="img"
     aria-label="Chain of custody. Each session carries an Ed25519-signed hash chain whose entries link by the previous entry's digest, so omission or reordering is detectable. A sealed segment is encrypted locally, uploaded, then read back and re-hashed by the server before acceptance. The archived WAV is bit-identical to what was captured and is the hashed evidence; the speech-recognition rendition is derived from it and is never hashed. Local audio moves from pending to committed to receipted to purged, and a hash mismatch quarantines the session so nothing is ever deleted automatically.">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="cc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor">
    <text x="40" y="32" font-size="12.5" font-weight="bold" letter-spacing="0.6">A · THE SESSION HASH CHAIN — one per consultation, signed by the device key</text>
  </g>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="48" width="112" height="58" rx="5"/>
    <rect x="192" y="48" width="112" height="58" rx="5"/>
    <rect x="344" y="48" width="112" height="58" rx="5"/>
    <rect x="496" y="48" width="112" height="58" rx="5"/>
    <rect x="648" y="48" width="112" height="58" rx="5"/>
    <rect x="800" y="48" width="112" height="58" rx="5"/>
    <rect x="952" y="48" width="88" height="58" rx="5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#c)">
    <path d="M152,77 L186,77"/><path d="M304,77 L338,77"/><path d="M456,77 L490,77"/>
    <path d="M608,77 L642,77"/><path d="M760,77 L794,77"/><path d="M912,77 L946,77"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" text-anchor="middle">
    <text x="96"  y="72" font-size="12" font-weight="bold">open</text>
    <text x="248" y="72" font-size="12" font-weight="bold">segment 1</text>
    <text x="400" y="72" font-size="12" font-weight="bold">segment 2</text>
    <text x="552" y="72" font-size="12" font-weight="bold">pause</text>
    <text x="704" y="72" font-size="12" font-weight="bold">resume</text>
    <text x="856" y="72" font-size="12" font-weight="bold">segment 3</text>
    <text x="996" y="72" font-size="12" font-weight="bold">close</text>
    <text x="96"  y="90" font-size="9.5" opacity="0.85">doctor · clinic</text>
    <text x="96"  y="101" font-size="9.5" opacity="0.85">patient · consent</text>
    <text x="248" y="90" font-size="9.5" opacity="0.85">audio SHA-256</text>
    <text x="248" y="101" font-size="9.5" opacity="0.85">bytes · rms</text>
    <text x="400" y="90" font-size="9.5" opacity="0.85">audio SHA-256</text>
    <text x="400" y="101" font-size="9.5" opacity="0.85">bytes · rms</text>
    <text x="552" y="90" font-size="9.5" opacity="0.85">reason</text>
    <text x="552" y="101" font-size="9.5" opacity="0.85">authorised by</text>
    <text x="704" y="90" font-size="9.5" opacity="0.85">resumed at</text>
    <text x="856" y="90" font-size="9.5" opacity="0.85">audio SHA-256</text>
    <text x="856" y="101" font-size="9.5" opacity="0.85">is_final</text>
    <text x="996" y="90" font-size="9.5" opacity="0.85">close reason</text>
    <text x="996" y="101" font-size="9.5" opacity="0.85">entry count</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" font-size="10" text-anchor="middle" opacity="0.9">
    <text x="169" y="70">prev_hash</text><text x="321" y="70">prev_hash</text><text x="473" y="70">prev_hash</text>
    <text x="625" y="70">prev_hash</text><text x="777" y="70">prev_hash</text><text x="929" y="70">prev_hash</text>
  </g>
  <text x="40" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="currentColor">
    Every entry carries the previous entry's digest and its own Ed25519 signature, so a removed, reordered or edited entry is detectable. The backend verifies the complete chain at close.</text>

  <!-- Section B -->
  <text x="40" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold"
        fill="currentColor" letter-spacing="0.6">B · WHAT HAPPENS TO THE AUDIO — one original, one derivative</text>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="196" width="150" height="56" rx="5"/>
    <rect x="238" y="196" width="150" height="56" rx="5"/>
    <rect x="436" y="196" width="170" height="56" rx="5"/>
    <rect x="654" y="196" width="170" height="56" rx="5" stroke-width="2.2"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#c)">
    <path d="M190,224 L232,224"/><path d="M388,224 L430,224"/><path d="M606,224 L648,224"/>
    <path d="M739,252 L739,286"/>
  </g>
  <g fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#cc)" stroke-dasharray="6 4">
    <path d="M824,224 L900,224 L900,300"/>
  </g>
  <g fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4">
    <rect x="820" y="300" width="220" height="86" rx="5"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="616" y="286" width="246" height="34" rx="5"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" text-anchor="middle">
    <text x="115" y="218" font-size="12" font-weight="bold">Sealed on the PC</text>
    <text x="115" y="234" font-size="10" opacity="0.85">AES-256-GCM</text>
    <text x="115" y="246" font-size="10" opacity="0.85">key wrapped by DPAPI</text>
    <text x="313" y="218" font-size="12" font-weight="bold">Object store</text>
    <text x="313" y="234" font-size="10" opacity="0.85">presigned PUT</text>
    <text x="313" y="246" font-size="10" opacity="0.85">300 s validity</text>
    <text x="521" y="218" font-size="12" font-weight="bold">Server read-back</text>
    <text x="521" y="234" font-size="10" opacity="0.85">re-hash and compare</text>
    <text x="521" y="246" font-size="10" opacity="0.85">mismatch → quarantine</text>
    <text x="739" y="218" font-size="12" font-weight="bold">Archived WAV</text>
    <text x="739" y="234" font-size="10" opacity="0.85">bit-identical to capture</text>
    <text x="739" y="246" font-size="10" opacity="0.85">never re-encoded</text>
    <text x="739" y="307" font-size="11" font-weight="bold">This file is the evidence — it is what the chain hashes</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#b3261e">
    <text x="930" y="322" font-size="11.5" font-weight="bold" text-anchor="middle">ASR rendition — derived</text>
    <text x="930" y="340" font-size="10" text-anchor="middle" fill="currentColor">high-pass 80 Hz · sliding-window</text>
    <text x="930" y="354" font-size="10" text-anchor="middle" fill="currentColor">normalisation · 16 kHz mono</text>
    <text x="930" y="374" font-size="10" text-anchor="middle" font-style="italic">disposable · never hashed</text>
  </g>

  <!-- Section C -->
  <text x="40" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold"
        fill="currentColor" letter-spacing="0.6">C · WHEN LOCAL AUDIO MAY BE DELETED</text>

  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="40" y="452" width="140" height="48" rx="24"/>
    <rect x="280" y="452" width="140" height="48" rx="24"/>
    <rect x="520" y="452" width="140" height="48" rx="24"/>
    <rect x="760" y="452" width="140" height="48" rx="24" stroke-width="2.2"/>
  </g>
  <g fill="none" stroke="#b3261e" stroke-width="1.8">
    <rect x="280" y="566" width="180" height="48" rx="24"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#c)">
    <path d="M180,476 L274,476"/><path d="M420,476 L514,476"/><path d="M660,476 L754,476"/>
  </g>
  <g fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#cc)">
    <path d="M350,500 L350,560"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" text-anchor="middle" font-size="12" font-weight="bold">
    <text x="110" y="481">PENDING</text>
    <text x="350" y="481">COMMITTED</text>
    <text x="590" y="481">RECEIPTED</text>
    <text x="830" y="481">PURGED</text>
  </g>
  <text x="370" y="595" font-family="Helvetica, Arial, sans-serif" fill="#b3261e" font-size="12"
        font-weight="bold" text-anchor="middle">QUARANTINED</text>
  <g font-family="Helvetica, Arial, sans-serif" fill="currentColor" font-size="10.5" text-anchor="middle">
    <text x="227" y="468">server verified</text><text x="227" y="496">the hash</text>
    <text x="467" y="468">archive copy</text><text x="467" y="496">verified</text>
    <text x="707" y="468">24 h grace</text><text x="707" y="496">elapsed</text>
  </g>
  <text x="362" y="536" font-family="Helvetica, Arial, sans-serif" fill="#b3261e" font-size="10.5">hash mismatch</text>
  <text x="474" y="592" font-family="Helvetica, Arial, sans-serif" fill="currentColor" font-size="10.5">never deleted automatically — a human decides</text>

  <g fill="none" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="4 4">
    <rect x="560" y="556" width="480" height="66" rx="6"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="580" y="580" font-size="12" font-weight="bold" fill="#b3261e">A purge receipt is the only authority to delete audio.</text>
    <text x="580" y="598" font-size="11" fill="currentColor">Nothing on the consulting-room PC is removed until the server has proved,</text>
    <text x="580" y="614" font-size="11" fill="currentColor">by re-hashing the stored bytes, that an archived copy exists and matches.</text>
  </g>
</svg>
