<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" color="#1a1a1a" role="img" aria-label="Chain of custody. Each session carries an Ed25519-signed hash chain whose entries embed the previous entry's digest. A segment is encrypted and uploaded automatically, then read back and re-hashed by the server; a mismatch quarantines the session, raises a critical alert and withholds the purge receipt, so both copies are kept and a human decides. The archived WAV is bit-identical to capture and is the hashed evidence; the recognition rendition is derived from it and never hashed. Local audio is deleted only on a purge receipt." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<text x="40" y="34" font-size="12" font-weight="600" fill="currentColor">A · THE SESSION HASH CHAIN — one per consultation, signed by the device key</text>
<rect x="40" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="110.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">open</text>
<text x="110.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">doctor · clinic</text>
<text x="110.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">patient · consent</text>
<rect x="200" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="270.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">segment 1</text>
<text x="270.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">audio SHA-256</text>
<text x="270.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">bytes · level</text>
<path d="M180,84 L194,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="360" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="430.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">segment 2</text>
<text x="430.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">audio SHA-256</text>
<text x="430.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">bytes · level</text>
<path d="M340,84 L354,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="590.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">pause</text>
<text x="590.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">reason</text>
<text x="590.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">authorised by</text>
<path d="M500,84 L514,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="680" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="750.0" y="81.215" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">resume</text>
<text x="750.0" y="95.435" font-size="9" text-anchor="middle" fill="currentColor">resumed at</text>
<path d="M660,84 L674,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="840" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="910.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">segment 3</text>
<text x="910.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">audio SHA-256</text>
<text x="910.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">is_final</text>
<path d="M820,84 L834,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="1000" y="52" width="140" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1070.0" y="74.405" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">close</text>
<text x="1070.0" y="88.625" font-size="9" text-anchor="middle" fill="currentColor">close reason</text>
<text x="1070.0" y="102.24499999999999" font-size="9" text-anchor="middle" fill="currentColor">entry count</text>
<path d="M980,84 L994,84" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="138" font-size="10.5" fill="currentColor">Every entry embeds the previous entry’s digest and carries its own signature, so a removed, reordered or edited entry is detectable. The backend verifies the complete chain at close.</text>
<text x="40" y="186" font-size="12" font-weight="600" fill="currentColor">B · WHAT HAPPENS TO THE AUDIO — uploaded automatically, deleted only by proof</text>
<rect x="40" y="210" width="190" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="135.0" y="230.815" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">Sealed on the PC</text>
<text x="135.0" y="245.505" font-size="9.5" text-anchor="middle" fill="currentColor">AES-256-GCM</text>
<text x="135.0" y="259.715" font-size="9.5" text-anchor="middle" fill="currentColor">key wrapped by DPAPI</text>
<rect x="272" y="210" width="172" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="358.0" y="230.815" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">Object store</text>
<text x="358.0" y="245.505" font-size="9.5" text-anchor="middle" fill="currentColor">presigned PUT</text>
<text x="358.0" y="259.715" font-size="9.5" text-anchor="middle" fill="currentColor">no human step</text>
<rect x="486" y="210" width="210" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="591.0" y="237.92000000000002" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">Server reads it back</text>
<text x="591.0" y="252.61" font-size="9.5" text-anchor="middle" fill="currentColor">re-hashes and compares</text>
<rect x="750" y="210" width="200" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="850.0" y="230.815" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">Archived WAV</text>
<text x="850.0" y="245.505" font-size="9.5" text-anchor="middle" fill="currentColor">bit-identical to capture</text>
<text x="850.0" y="259.715" font-size="9.5" text-anchor="middle" fill="currentColor">this is the evidence</text>
<path d="M230,241 L266,241" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M444,241 L480,241" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M696,241 L744,241" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="720" y="233" font-size="9.5" text-anchor="middle" fill="currentColor">match</text>
<path d="M591,272 L591,318" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<rect x="486" y="318" width="210" height="58" rx="5" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="591.0" y="336.815" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b3261e">QUARANTINED</text>
<text x="591.0" y="351.505" font-size="9.5" text-anchor="middle" fill="#b3261e">critical alert raised</text>
<text x="591.0" y="365.715" font-size="9.5" text-anchor="middle" fill="#b3261e">no purge receipt issued</text>
<text x="601" y="300" font-size="9.5" fill="#b3261e">mismatch</text>
<path d="M850,272 L850,318" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arA)"/>
<rect x="750" y="318" width="200" height="58" rx="5" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="850.0" y="336.64" font-size="11" font-weight="600" text-anchor="middle" fill="#b3261e">ASR rendition</text>
<text x="850.0" y="351.21" font-size="9.5" text-anchor="middle" fill="#b3261e">derived · 16 kHz</text>
<text x="850.0" y="365.41999999999996" font-size="9.5" text-anchor="middle" fill="#b3261e">never hashed</text>
<text x="40" y="400" font-size="10.5" fill="currentColor">The upload is automatic and needs no human. Verification happens on arrival, not before it — so a bad segment reaches storage, and is then caught there.</text>
<text x="40" y="416" font-size="10.5" fill="currentColor">What a mismatch withholds is the purge receipt. Both copies survive, the session is never archived, and an operator decides what happens next.</text>
<text x="40" y="470" font-size="12" font-weight="600" fill="currentColor">C · WHEN LOCAL AUDIO MAY BE DELETED</text>
<rect x="40" y="500" width="170" height="48" rx="24" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="125.0" y="528.1999999999999" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">PENDING</text>
<rect x="290" y="500" width="170" height="48" rx="24" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="375.0" y="528.1999999999999" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">COMMITTED</text>
<path d="M210,524 L284,524" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="540" y="500" width="170" height="48" rx="24" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="625.0" y="528.1999999999999" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">RECEIPTED</text>
<path d="M460,524 L534,524" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="790" y="500" width="170" height="48" rx="24" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="875.0" y="528.1999999999999" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">PURGED</text>
<path d="M710,524 L784,524" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="250" y="505" font-size="9" text-anchor="middle" fill="currentColor">server verified</text>
<text x="250" y="516" font-size="9" text-anchor="middle" fill="currentColor">the hash</text>
<text x="500" y="505" font-size="9" text-anchor="middle" fill="currentColor">archive copy</text>
<text x="500" y="516" font-size="9" text-anchor="middle" fill="currentColor">verified</text>
<text x="750" y="505" font-size="9" text-anchor="middle" fill="currentColor">24 h grace</text>
<text x="750" y="516" font-size="9" text-anchor="middle" fill="currentColor">elapsed</text>
<path d="M375,548 L375,592" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#arA)"/>
<rect x="290" y="592" width="200" height="46" rx="23" fill="none" stroke="#b3261e" stroke-width="1.8"/>
<text x="390.0" y="619.025" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b3261e">QUARANTINED</text>
<text x="385" y="574" font-size="9" fill="#b3261e">hash mismatch</text>
<text x="500" y="620" font-size="10" fill="currentColor">never deleted automatically — a human decides, and until they do both copies are kept</text>
<text x="40" y="690" font-size="12" font-weight="600" fill="#b3261e">A purge receipt is the only authority to delete audio.</text>
<text x="40" y="708" font-size="11" fill="currentColor">Nothing on the consulting-room PC is removed until the server has proved, by re-hashing the stored bytes, that an archived copy exists and matches.</text>
<text x="40" y="724" font-size="11" fill="currentColor">A quarantined session therefore holds its local audio indefinitely. That is deliberate: the disk fills before the evidence disappears.</text>
</svg>
