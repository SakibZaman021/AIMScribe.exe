<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 880" color="#1a1a1a" role="img" aria-label="Architecture block diagram. The third-party electronic health record node serves the clinical page to the consulting-room workstation over HTTPS, and sends clinical data directly to the AIMS Lab backend over a server-to-server channel. The page signals the aimscribe.exe tray daemon over a loopback channel confined to the same machine. Audio travels only from the workstation to the backend, and never towards the EHR node." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="150" y="34" width="350" height="78" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="150" y="26" font-size="11" font-weight="600" fill="currentColor">THIRD-PARTY EHR NODE</text>
<rect x="168" y="50" width="314" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="325.0" y="71.04" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">CMED · Aalo · Amader Susastho</text>
<text x="325.0" y="85.14" font-size="9" text-anchor="middle" fill="currentColor">one interface contract, three vendors</text>
<rect x="20" y="150" width="565" height="386" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="20" y="142" font-size="11" font-weight="600" fill="currentColor">CONSULTING-ROOM WORKSTATION</text>
<rect x="36" y="176" width="250" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="161.0" y="201.335" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Microphone array</text>
<text x="161.0" y="214.965" font-size="8.5" text-anchor="middle" fill="currentColor">fixed placement, no processing</text>
<rect x="318" y="176" width="250" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="443.0" y="201.04" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">EHR page in browser</text>
<text x="443.0" y="215.14" font-size="9" text-anchor="middle" fill="currentColor">dispatches the trigger</text>
<rect x="36" y="262" width="532" height="256" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
<text x="302" y="282" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">aimscribe.exe — tray daemon</text>
<rect x="54" y="294" width="496" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="314.5" font-size="10" text-anchor="middle" fill="currentColor">Acquisition · linear PCM at native rate</text>
<rect x="54" y="338" width="496" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="358.5" font-size="10" text-anchor="middle" fill="currentColor">Segmentation · adaptive noise floor</text>
<rect x="54" y="382" width="496" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="402.5" font-size="10" text-anchor="middle" fill="currentColor">Encrypted buffer · AES-256-GCM</text>
<rect x="54" y="426" width="496" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="446.5" font-size="10" text-anchor="middle" fill="currentColor">Hash chain · Ed25519, per session</text>
<rect x="54" y="470" width="496" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="490.5" font-size="10" text-anchor="middle" fill="currentColor">Asynchronous transport</text>
<path d="M302,112 L302,170" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="312" y="136" font-size="9" fill="currentColor">HTTPS page delivery</text>
<path d="M443,232 L443,256" fill="none" stroke="#b3261e" stroke-width="2.2" marker-end="url(#arA)"/>
<text x="453" y="248" font-size="9" font-weight="600" fill="#b3261e">Channel A</text>
<path d="M161,232 L161,288" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="171" y="256" font-size="9" fill="currentColor">analogue audio</text>
<path d="M302,328 L302,338" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M302,372 L302,382" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M302,416 L302,426" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M302,460 L302,470" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="594" width="565" height="258" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="20" y="586" font-size="11" font-weight="600" fill="currentColor">AIMS LAB BACKEND</text>
<rect x="36" y="620" width="250" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="161.0" y="643.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">API</text>
<text x="161.0" y="657.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">authorisation · verification</text>
<rect x="318" y="620" width="250" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="443.0" y="643.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Clinical store</text>
<text x="443.0" y="657.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">prescriptions · notes</text>
<rect x="36" y="700" width="250" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="161.0" y="723.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Object store</text>
<text x="161.0" y="737.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">sealed segments</text>
<rect x="318" y="700" width="250" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="443.0" y="723.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Archive</text>
<text x="443.0" y="737.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">verified recordings</text>
<rect x="36" y="780" width="532" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="302.0" y="800.16" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Server-side verification</text>
<text x="302.0" y="813.67" font-size="8.5" text-anchor="middle" fill="currentColor">every segment re-read and re-hashed before acceptance</text>
<path d="M161,672 L161,694" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M443,672 L443,694" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M161,752 L161,774" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M443,752 L443,774" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M302,518 L302,614" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#arA)"/>
<text x="312" y="552" font-size="9" fill="#b3261e">audio, encrypted</text>
<text x="312" y="566" font-size="9" fill="#b3261e">TLS · device token</text>
<path d="M500,73 L640,73 L640,646 L592,646" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#arA)"/>
<text x="590" y="100" font-size="8.5" font-weight="600" fill="#b3261e">Channel B</text>
<text x="590" y="113" font-size="8.5" fill="#b3261e">clinical</text>
<text x="590" y="126" font-size="8.5" fill="#b3261e">data</text>
<text x="20" y="872" font-size="9" fill="#b3261e">Accented pathways are encrypted and mutually authenticated. Audio never travels towards the EHR node.</text>
</svg>
