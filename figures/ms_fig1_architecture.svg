<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 880" color="#1a1a1a" role="img" aria-label="Architecture block diagram. The third-party electronic health record node serves the clinical page to the consulting-room workstation over HTTPS. That page signals the aimscribe.exe tray daemon over a loopback channel confined to the same machine. Encrypted, mutually authenticated pathways carry sealed audio and control traffic to the AIMS Lab backend. No network path exists between the EHR node and the backend." font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="150" y="34" width="360" height="78" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="150" y="26" font-size="11" font-weight="600" fill="currentColor">THIRD-PARTY EHR NODE</text>
<rect x="168" y="50" width="324" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="71.04" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">CMED · Aalo · Amader Susastho</text>
<text x="330.0" y="85.14" font-size="9" text-anchor="middle" fill="currentColor">one interface contract, three vendors</text>
<rect x="20" y="150" width="620" height="386" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="20" y="142" font-size="11" font-weight="600" fill="currentColor">CONSULTING-ROOM WORKSTATION</text>
<rect x="40" y="176" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="174.0" y="201.335" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Microphone array</text>
<text x="174.0" y="214.965" font-size="8.5" text-anchor="middle" fill="currentColor">fixed placement, no vendor processing</text>
<rect x="352" y="176" width="268" height="56" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="486.0" y="201.04" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">EHR page in browser</text>
<text x="486.0" y="215.14" font-size="9" text-anchor="middle" fill="currentColor">dispatches the trigger</text>
<rect x="40" y="262" width="580" height="256" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
<text x="330" y="282" font-size="11.5" font-weight="600" text-anchor="middle" fill="currentColor">aimscribe.exe — tray daemon</text>
<rect x="58" y="294" width="544" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="314.5" font-size="10" text-anchor="middle" fill="currentColor">Acquisition · linear PCM at native rate</text>
<rect x="58" y="338" width="544" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="358.5" font-size="10" text-anchor="middle" fill="currentColor">Segmentation · adaptive noise floor</text>
<rect x="58" y="382" width="544" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="402.5" font-size="10" text-anchor="middle" fill="currentColor">Encrypted spool · AES-256-GCM, 40 GB</text>
<rect x="58" y="426" width="544" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="446.5" font-size="10" text-anchor="middle" fill="currentColor">Hash chain · Ed25519, per session</text>
<rect x="58" y="470" width="544" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="490.5" font-size="10" text-anchor="middle" fill="currentColor">Asynchronous transport</text>
<path d="M330,112 L330,170" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="340" y="136" font-size="9" fill="currentColor">HTTPS page delivery</text>
<path d="M486,232 L486,256" fill="none" stroke="#b3261e" stroke-width="2.2" marker-end="url(#arA)"/>
<text x="496" y="248" font-size="9" fill="#b3261e">loopback trigger</text>
<path d="M174,232 L174,288" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="184" y="256" font-size="9" fill="currentColor">analogue audio</text>
<path d="M330,328 L330,338" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M330,372 L330,382" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M330,416 L330,426" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M330,460 L330,470" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="594" width="620" height="258" rx="8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.55"/>
<text x="20" y="586" font-size="11" font-weight="600" fill="currentColor">AIMS LAB BACKEND</text>
<rect x="40" y="620" width="268" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="174.0" y="643.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">API</text>
<text x="174.0" y="657.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">authorisation · verification</text>
<rect x="352" y="620" width="268" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="486.0" y="643.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Metadata store</text>
<text x="486.0" y="657.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">sessions · audit log</text>
<rect x="40" y="700" width="268" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="174.0" y="723.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Object store</text>
<text x="174.0" y="737.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">sealed segments</text>
<rect x="352" y="700" width="268" height="52" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="486.0" y="723.0400000000001" font-size="11" font-weight="600" text-anchor="middle" fill="currentColor">Archive</text>
<text x="486.0" y="737.1400000000001" font-size="9" text-anchor="middle" fill="currentColor">verified recordings</text>
<rect x="40" y="780" width="580" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330.0" y="800.16" font-size="10.5" font-weight="600" text-anchor="middle" fill="currentColor">Server-side verification</text>
<text x="330.0" y="813.67" font-size="8.5" text-anchor="middle" fill="currentColor">every segment re-read and re-hashed before acceptance</text>
<path d="M308,646 L346,646" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M174,672 L174,694" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M308,726 L346,726" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M174,752 L174,774" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M486,752 L486,774" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M330,518 L330,614" fill="none" stroke="#b3261e" stroke-width="2.4" marker-end="url(#arA)"/>
<text x="340" y="560" font-size="9" fill="#b3261e">TLS · device token</text>
<text x="340" y="574" font-size="9" fill="#b3261e">sealed payload</text>
<path d="M510,73 L572,73" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 5"/>
<path d="M580,63 L600,83" fill="none" stroke="#b3261e" stroke-width="2.2"/>
<path d="M600,63 L580,83" fill="none" stroke="#b3261e" stroke-width="2.2"/>
<text x="515" y="96" font-size="9" font-weight="600" fill="#b3261e">no path exists between</text>
<text x="515" y="109" font-size="9" fill="#b3261e">the EHR node and backend</text>
<text x="20" y="872" font-size="9" fill="#b3261e">Accented pathways are encrypted and mutually authenticated.</text>
</svg>
